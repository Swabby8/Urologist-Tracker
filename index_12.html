<!DOCTYPE html>
<html lang="en" data-tab="day">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Urologist Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Uro Tracker"/>
<meta name="theme-color" content="#b8470f"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="icon" type="image/png" href="icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--sans:'DM Sans',-apple-system,system-ui,sans-serif;--mono:'DM Mono',ui-monospace,Menlo,monospace;--r:18px;--rs:12px}

/* ── Per-tab colour schemes ─────────────────────────────── */
html[data-tab="day"]{
  --bg:#fbf4e8;--surface:#ffffff;--surface2:#f7eedc;--surface3:#efe2c8;
  --border:rgba(90,60,10,.11);--text:#2a2012;--muted:#7a6a52;
  --accent:#c2570a;--accent-lt:rgba(194,87,10,.12);--accent-glow:rgba(194,87,10,.28);
  --btn1:#b8530a;--btn2:#dc7a12;
  --hero1:#e38a1e;--hero2:#ad430e;--hero-shadow:rgba(173,67,14,.30);
  --hero-deco:radial-gradient(circle at 90% 14%,rgba(255,236,170,.65) 0,rgba(255,236,170,0) 34%),radial-gradient(circle at 8% 110%,rgba(255,255,255,.14) 0,rgba(255,255,255,0) 45%);
  --shadow:0 2px 14px rgba(120,70,10,.10);color-scheme:light}
html[data-tab="night"]{
  --bg:#070b1d;--surface:#101735;--surface2:#19224a;--surface3:#232f5e;
  --border:rgba(255,255,255,.08);--text:#eaeefc;--muted:#8d9bc8;
  --accent:#a99dff;--accent-lt:rgba(139,124,246,.18);--accent-glow:rgba(110,92,235,.40);
  --btn1:#5b49d8;--btn2:#8171f0;
  --hero1:#232d78;--hero2:#0a0f33;--hero-shadow:rgba(0,0,0,.5);
  --hero-deco:radial-gradient(1.6px 1.6px at 12% 30%,#fff 50%,transparent 52%),radial-gradient(1.2px 1.2px at 26% 70%,rgba(255,255,255,.8) 50%,transparent 52%),radial-gradient(1.6px 1.6px at 44% 22%,rgba(255,255,255,.9) 50%,transparent 52%),radial-gradient(1.2px 1.2px at 63% 60%,rgba(255,255,255,.7) 50%,transparent 52%),radial-gradient(1.6px 1.6px at 78% 18%,#fff 50%,transparent 52%),radial-gradient(1.2px 1.2px at 92% 52%,rgba(255,255,255,.8) 50%,transparent 52%),radial-gradient(circle at 88% 8%,rgba(180,170,255,.45) 0,rgba(180,170,255,0) 32%);
  --shadow:0 2px 16px rgba(0,0,0,.45);color-scheme:dark}
html[data-tab="intake"]{
  --bg:#eaf6fb;--surface:#ffffff;--surface2:#e0f0f8;--surface3:#cde5f1;
  --border:rgba(10,60,90,.11);--text:#0c2535;--muted:#527689;
  --accent:#0a76a3;--accent-lt:rgba(10,118,163,.12);--accent-glow:rgba(10,118,163,.28);
  --btn1:#0a6f9c;--btn2:#1c9bcb;
  --hero1:#1796c9;--hero2:#09557f;--hero-shadow:rgba(9,85,127,.30);
  --hero-deco:radial-gradient(circle at 10% 8%,rgba(255,255,255,.28) 0,rgba(255,255,255,0) 34%),radial-gradient(ellipse at 100% 120%,rgba(255,255,255,.2) 0,rgba(255,255,255,0) 55%);
  --shadow:0 2px 14px rgba(10,70,100,.10);color-scheme:light}
html[data-tab="stats"],html[data-tab="settings"]{
  --bg:#f1f5f2;--surface:#ffffff;--surface2:#e7eee9;--surface3:#d6e3da;
  --border:rgba(20,50,35,.11);--text:#14261d;--muted:#5a7366;
  --accent:#23704f;--accent-lt:rgba(35,112,79,.12);--accent-glow:rgba(35,112,79,.28);
  --btn1:#1d6a49;--btn2:#2f8e63;
  --hero1:#2f8a62;--hero2:#15503a;--hero-shadow:rgba(21,80,58,.30);
  --hero-deco:radial-gradient(circle at 92% 10%,rgba(255,255,255,.22) 0,rgba(255,255,255,0) 36%);
  --shadow:0 2px 14px rgba(20,60,40,.09);color-scheme:light}

html{background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none;min-height:100vh;transition:background .35s}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:500px;margin:0 auto;padding:0 16px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── Hero ───────────────────────────────────────────────── */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(160deg,var(--hero1),var(--hero2));padding:calc(env(safe-area-inset-top,0px) + 10px) 0 22px;border-radius:0 0 28px 28px;box-shadow:0 8px 28px var(--hero-shadow);transition:background .35s}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;background:var(--hero-deco)}
.hero .wrap{position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.hero-label{font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;opacity:.9}
.hero-btn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center}
.hero-btn:active{background:rgba(255,255,255,.28)}
.hero-btn.back{width:auto;padding:0 12px 0 8px;gap:2px;font-size:14px;font-weight:600}
.hero-btn .ic{width:20px;height:20px}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
.st-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);color:#fff}
.st-btn:disabled{opacity:.28}
.st-label{position:relative;flex:1;text-align:center;font-size:18px;font-weight:600;letter-spacing:-.2px;padding:8px 6px;border-radius:12px}
.st-label small{display:block;font-size:11px;font-weight:500;opacity:.82;margin-top:1px;letter-spacing:.2px}
.st-pick{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0}
.today-pill{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);font-size:12px;font-weight:600;color:#fff}
.hero-total{margin-top:14px;display:flex;align-items:baseline;gap:8px}
.big{font-size:54px;font-weight:600;letter-spacing:-1.8px;line-height:1}
.hero-unit{font-size:20px;font-weight:500;opacity:.88}
.hero-sub{margin-top:9px;font-size:13px;line-height:1.45;opacity:.92}
.range-row{display:flex;gap:8px;margin-top:14px}
.range-chip{flex:1;padding:9px 4px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff}
.range-chip.on{background:#fff;color:var(--hero2);border-color:#fff}

/* ── Layout ─────────────────────────────────────────────── */
.main{padding-top:16px;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.card-title{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.link-btn{font-size:13px;font-weight:600;color:var(--accent);padding:4px 2px}
.link-btn.danger{color:#c43a3a}
.field{margin-bottom:18px}.field:last-child{margin-bottom:0}
.flabel{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}
.fhint{font-size:11.5px;font-weight:400;color:var(--muted);opacity:.9}
.hint{font-size:12px;color:var(--muted);margin-top:7px;min-height:15px;font-family:var(--mono)}

input[type=time],input[type=date],input[type=text],textarea{font-family:var(--sans);-webkit-appearance:none;appearance:none;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;font-size:17px;color:var(--text);outline:none;min-height:50px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-lt)}
input::-webkit-date-and-time-value{text-align:left}
textarea{width:100%;resize:none;font-size:16px;line-height:1.45;min-height:70px}
.time-row,.amt-row{display:flex;gap:10px;align-items:stretch}
.time-row input{flex:1;min-width:0}
.now-btn{padding:0 18px;border-radius:var(--rs);background:var(--accent-lt);color:var(--accent);font-size:14px;font-weight:700;border:1px solid var(--border)}
.now-btn:active{opacity:.7}
.amt-input{flex:1;min-width:0;font-family:var(--mono)!important;font-size:24px!important;font-weight:500}
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:3px;gap:2px}
.seg button{padding:0 16px;border-radius:9px;font-size:15px;font-weight:700;color:var(--muted);min-width:54px}
.seg button.on{background:linear-gradient(145deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 2px 8px var(--accent-glow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:9px 14px;border-radius:22px;border:1px solid var(--border);background:var(--surface2);font-size:14px;font-weight:500;color:var(--text);transition:all .12s}
.chip.preset{font-family:var(--mono);font-size:14px;padding:8px 13px}
.chip.sel{background:var(--accent-lt);border-color:var(--accent);color:var(--text);font-weight:700;box-shadow:0 0 0 1px var(--accent) inset}
.yn{display:flex;gap:10px}
.yn button{flex:1;padding:13px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface2);font-size:15px;font-weight:600;color:var(--muted)}
.yn button.sel{background:var(--accent-lt);border-color:var(--accent);color:var(--text);box-shadow:0 0 0 1px var(--accent) inset}
.urg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.urg{position:relative;height:52px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);font-size:20px;font-weight:600;font-family:var(--mono);color:var(--text);overflow:hidden;transition:transform .1s}
.urg::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--uc)}
.urg:active{transform:scale(.96)}
.urg.sel{background:var(--uc);color:var(--uf);border-color:var(--uc);box-shadow:0 4px 14px color-mix(in srgb,var(--uc) 55%,transparent)}
.urg.sel::after{display:none}
.btn-primary{width:100%;padding:16px;border-radius:16px;background:linear-gradient(145deg,var(--btn1),var(--btn2));color:#fff;font-size:16px;font-weight:700;letter-spacing:.1px;box-shadow:0 6px 18px var(--accent-glow);transition:transform .1s,filter .15s}
.btn-primary:active{transform:scale(.985);filter:brightness(.95)}
.btn-primary.ok{background:linear-gradient(145deg,#1f9e63,#35c286)}
.btn-primary.err{background:linear-gradient(145deg,#c43a3a,#e0584f)}
.btn-primary.editing{background:linear-gradient(145deg,#c98a00,#efb02a);color:#2a1d00}
.btn-ghost{width:100%;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-ghost.danger{color:#c43a3a;background:transparent;border-color:rgba(196,58,58,.35)}
.btn-row{display:flex;gap:10px;margin-top:10px}
.toggle-link{font-size:13px;font-weight:600;color:var(--accent);padding:2px 0}

/* ── Entry list ─────────────────────────────────────────── */
.entry{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);width:100%;text-align:left}
.entry:last-child{border-bottom:0;padding-bottom:2px}
.entry:first-of-type{padding-top:2px}
.e-time{width:68px;flex-shrink:0;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--muted)}
.e-main{flex:1;min-width:0}
.e-amt{font-size:18px;font-weight:600;letter-spacing:-.3px}
.e-amt small{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px;font-family:var(--mono)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.tag.acc{background:var(--accent-lt);border-color:transparent}
.e-note{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:5px;line-height:1.4;word-break:break-word}
.ub{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:16px;flex-shrink:0}
.ub-cap{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:center;margin-top:3px}
.empty{text-align:center;padding:26px 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
.empty .em{font-size:30px;display:block;margin-bottom:6px}
.cut-status{margin-top:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--accent-lt)}
.cut-status b{font-weight:700}

/* ── Banner ─────────────────────────────────────────────── */
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:13px;line-height:1.35;background:rgba(245,166,35,.16);border:1px solid rgba(245,166,35,.45);color:var(--text)}
.banner button{padding:7px 13px;border-radius:9px;border:1px solid currentColor;font-size:12.5px;font-weight:700;white-space:nowrap}

/* ── Bottom nav ─────────────────────────────────────────── */
.nav{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:calc(100% - 24px);max-width:476px;display:flex;gap:4px;padding:6px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:40}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:16px;font-size:11px;font-weight:600;color:var(--muted);transition:all .2s}
.nav button.on{background:var(--accent-lt);color:var(--accent)}

/* ── Stats ──────────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface2);border-radius:14px;padding:13px 13px 12px;border:1px solid var(--border)}
.tile .tl{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.25}
.tile .tv{font-size:26px;font-weight:600;letter-spacing:-.6px;margin-top:5px;line-height:1.05}
.tile .tv small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.tile .ts{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.3}
.tile.wide{grid-column:1/-1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 10px;font-size:12px;color:var(--text)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.dot{border-radius:50%}.legend i.ln{height:3px;border-radius:2px;vertical-align:3px;width:14px}
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
svg.chart{display:block;overflow:visible}
svg.chart text{font-family:var(--sans)}
.hit{fill:transparent;cursor:pointer}.hit:hover,.hit.on{fill:rgba(11,11,11,.055)}
.chart-note{font-size:12px;color:#5f6e66;margin-top:8px;line-height:1.4}
.hbar{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.hbar .trk{height:10px;border-radius:5px;background:var(--surface2)}
.hbar .fill{height:10px;border-radius:0 5px 5px 0;min-width:2px}
.hbar .hv{font-family:var(--mono);font-size:12px;color:var(--text);min-width:58px;text-align:right}
.seg-bar{display:flex;gap:2px;height:10px;margin:10px 0 8px}
.seg-bar span{display:block;height:10px}.seg-bar span:first-child{border-radius:5px 0 0 5px}.seg-bar span:last-child{border-radius:0 5px 5px 0}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;text-align:right;padding:0 0 8px 6px}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td{padding:8px 0 8px 6px;border-top:1px solid var(--border);text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
.tbl td:first-child{font-family:var(--sans);font-weight:600}
.tip{width:max-content;position:fixed;z-index:100;pointer-events:none;background:#fff;color:#0b0b0b;border:1px solid rgba(11,11,11,.12);border-radius:12px;padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,.22);font-size:12px;min-width:120px;max-width:240px;transform:translate(-50%,-100%)}
.tip .tt{color:#52514e;font-size:11px;margin-bottom:5px;font-weight:600}
.tip .tr{display:flex;align-items:center;gap:7px;margin-top:3px;white-space:nowrap}
.tip .tk{width:10px;height:3px;border-radius:2px;flex-shrink:0}
.tip .tvv{font-weight:700;font-size:13px}.tip .tl2{color:#52514e}
.tip[hidden]{display:none}
.stat-sep{height:1px;background:var(--border);margin:16px 0}
.note-s{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:12px}
.bar-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.meter{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden}.meter>div{height:100%;border-radius:3px;transition:width .5s}
</style>
</head>
<body>
<div id="app">
  <header class="hero" id="hero"></header>
  <main class="wrap main">
    <div id="banner"></div>
    <section id="view-day" class="view"></section>
    <section id="view-night" class="view"></section>
    <section id="view-intake" class="view"></section>
    <section id="view-stats" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>
  <nav class="nav" id="nav"></nav>
  <div class="tip" id="tip" hidden></div>
</div>
<input type="file" id="csv-in" accept=".csv,text/csv" hidden/>

<script>
'use strict';
/* ═════════════ Constants & helpers ═════════════ */
const K_E='uro_entries_v1',K_S='uro_settings_v1',K_C='uro_cutoffs_v1',K_X='uro_last_export',K_T='uro_last_tab';
const KINDS=['day','night','intake'];
const MLOZ=29.5735295625;
const SYMS=[['weak','Weak flow'],['dribble','Dribbling'],['incomplete','Feeling of not emptying'],['pain','Pain or burning']];
const DRINKS=[['Water','💧'],['Coffee','☕'],['Tea','🍵'],['Alcohol','🍷'],['Other','🥤']];
const PRESETS={void:{ml:[100,200,300,400,500],oz:[4,8,12,16,20]},intake:{ml:[100,250,350,500,750,1000],oz:[4,8,12,16,24,32]}};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
const UC=['#2fb37a','#4cb96b','#7cbf59','#a8c449','#d3c23d','#efb232','#f2962c','#ee762d','#e4573a','#d13d41'].map(bg=>[bg,lum(bg)>0.18?'#10201a':'#ffffff']);
const CC={day:'#eb6834',night:'#6250d6',intake:'#2a78d6',ink:'#0b0b0b',ink2:'#52514e',mut:'#898781',grid:'#e1e0d9',base:'#c3c2b7',slate:'#5a6472',surf:'#ffffff'};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return dstr(d);};
const todayKey=()=>dstr(new Date());
const nowHHMM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const fmt12=t=>{const[h,m]=t.split(':').map(Number);return ((h+11)%12+1)+':'+pad(m)+' '+(h<12?'AM':'PM');};
const fmtDay=s=>{const d=pd(s);return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});};
const fmtShort=s=>{const d=pd(s);return MON[d.getMonth()]+' '+d.getDate();};
const fmtNight=s=>{const a=pd(s),b=pd(addDays(s,1));return a.getMonth()===b.getMonth()?`${MON[a.getMonth()]} ${a.getDate()} → ${b.getDate()}`:`${MON[a.getMonth()]} ${a.getDate()} → ${MON[b.getMonth()]} ${b.getDate()}`;};
const r1=n=>Math.round(n*10)/10;
const fmtMl=n=>Math.round(n).toLocaleString('en-US');
const fmtOz=ml=>r1(ml/MLOZ).toLocaleString('en-US',{maximumFractionDigits:1});
const toMl=(a,u)=>u==='oz'?a*MLOZ:a;
const actDate=e=>e.kind==='night'&&e.time<'12:00'?addDays(e.period,1):e.period;
const sortKey=e=>actDate(e)+' '+e.time;
function defaultPeriod(k){const n=new Date(),t=dstr(n);return (k==='night'&&n.getHours()<12)?addDays(t,-1):t;}

/* ═════════════ State ═════════════ */
let entries=[],cutoffs={},S={units:{day:'ml',night:'ml',intake:'oz'}};
let tab='day',prevTab='day',range=14;

function load(){
  try{entries=JSON.parse(localStorage.getItem(K_E))||[];}catch(e){entries=[];}
  try{cutoffs=JSON.parse(localStorage.getItem(K_C))||{};}catch(e){cutoffs={};}
  try{const s=JSON.parse(localStorage.getItem(K_S));if(s&&s.units)S.units=Object.assign(S.units,s.units);}catch(e){}
}
function persist(){
  try{localStorage.setItem(K_E,JSON.stringify(entries));localStorage.setItem(K_C,JSON.stringify(cutoffs));localStorage.setItem(K_S,JSON.stringify(S));return true;}
  catch(e){alert('Could not save — device storage may be full or blocked.');return false;}
}
function newForm(k){return {unit:S.units[k],urg:null,sym:new Set(),woke:'',drink:'Water',note:'',noteOpen:false,timeDirty:false,editId:null};}
const curPeriod=k=>sel[k]||defaultPeriod(k);

function syncForm(k){
  const f=F[k],night=k==='night',intake=k==='intake';
  document.querySelectorAll(`#${k}-unit button`).forEach(b=>b.classList.toggle('on',b.dataset.u===f.unit));
  const pre=PRESETS[intake?'intake':'void'][f.unit];
  $(k+'-presets').innerHTML=pre.map(v=>`<button class="chip preset" data-act="preset" data-k="${k}" data-v="${v}">${v}</button>`).join('');
  convHint(k);
  if(!intake){
    document.querySelectorAll(`#${k}-urg .urg`).forEach(b=>b.classList.toggle('sel',+b.dataset.n===f.urg));
    document.querySelectorAll(`#${k}-syms .chip`).forEach(b=>b.classList.toggle('sel',f.sym.has(b.dataset.s)));
  }else document.querySelectorAll(`#${k}-drinks .chip`).forEach(b=>b.classList.toggle('sel',b.dataset.v===f.drink));
  if(night)document.querySelectorAll(`#${k}-woke button`).forEach(b=>b.classList.toggle('sel',b.dataset.v===f.woke));
  $(k+'-notebox').hidden=!f.noteOpen;$(k+'-notelnk').textContent=f.noteOpen?'− Hide note':'+ Add note';
  const editing=!!f.editId,sb=$(k+'-save');
  sb.textContent=editing?'Update entry':'Save entry';sb.className='btn-primary'+(editing?' editing':'');
  $(k+'-cancel').hidden=!editing;$(k+'-del').hidden=!editing;$(k+'-pdate-f').hidden=!editing;
  $(k+'-ftitle').textContent=editing?'Editing entry':(intake?'Log a drink':night?'Log a night bathroom trip':'Log a bathroom trip');
}
function convHint(k){
  const v=parseFloat($(k+'-amt').value.replace(',','.'));const f=F[k];
  $(k+'-conv').textContent=v>0?('≈ '+(f.unit==='ml'?fmtOz(v)+' oz':fmtMl(v*MLOZ)+' ml')):'';
}
function refreshTimes(force){
  KINDS.forEach(k=>{const f=F[k],el=$(k+'-time');if(f.editId||document.activeElement===el)return;if(force||!f.timeDirty){el.value=nowHHMM();f.timeDirty=false;}});
}
function resetForm(k){
  const f=F[k];Object.assign(f,{urg:null,sym:new Set(),woke:'',drink:'Water',note:'',noteOpen:false,timeDirty:false,editId:null});
  $(k+'-amt').value='';$(k+'-note').value='';$(k+'-time').value=nowHHMM();
  syncForm(k);
}
function flash(k,msg,cls){const b=$(k+'-save'),old=b.textContent,oc=b.className;b.textContent=msg;b.className='btn-primary '+cls;setTimeout(()=>{if(b.textContent===msg){b.textContent=old;b.className=oc;}},1600);}
function saveEntry(k){
  const f=F[k],raw=$(k+'-amt').value.replace(',','.').trim(),amt=parseFloat(raw),time=$(k+'-time').value;
  if(!time)return flash(k,'Set a time','err');
  if(!(amt>0))return flash(k,'Enter an amount','err');
  if(k!=='intake'&&!f.urg)return flash(k,'Pick an urgency 1–10','err');
  const ex=f.editId?entries.find(e=>e.id===f.editId):null;
  const period=ex?($(k+'-pdate').value||ex.period):curPeriod(k);
  const e={id:ex?ex.id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind:k,period,time,amt:Math.round(amt*100)/100,unit:f.unit,ml:Math.round(toMl(amt,f.unit)*10)/10,note:$(k+'-note').value.trim(),ts:ex?ex.ts:Date.now()};
  if(k==='intake')e.drink=f.drink;else{e.urg=f.urg;e.sym=[...f.sym];}
  if(k==='night')e.woke=f.woke;
  if(ex)entries[entries.indexOf(ex)]=e;else entries.push(e);
  if(!persist())return;
  S.units[k]=f.unit;persist();
  const wasEdit=!!ex;resetForm(k);render();flash(k,wasEdit?'✓ Updated':'✓ Saved','ok');
}
function editEntry(k,id){
  const e=entries.find(x=>x.id===id);if(!e)return;const f=F[k];
  Object.assign(f,{unit:e.unit,urg:e.urg||null,sym:new Set(e.sym||[]),woke:e.woke||'',drink:e.drink||'Water',note:e.note||'',noteOpen:!!e.note,editId:id,timeDirty:true});
  $(k+'-time').value=e.time;$(k+'-amt').value=String(e.amt);$(k+'-note').value=e.note||'';$(k+'-pdate').value=e.period;
  syncForm(k);window.scrollTo({top:0,behavior:'smooth'});
}
function delEntry(k){
  const f=F[k];if(!f.editId||!confirm('Delete this entry?'))return;
  entries=entries.filter(e=>e.id!==f.editId);persist();resetForm(k);render();
}

/* ═════════════ Rendering: hero, lists, banner, nav ═════════════ */
const HERO_LABEL={day:'Daytime',night:'Night',intake:'Liquid intake',stats:'Stats',settings:'Settings'};
function periodLabel(k,p){
  const def=defaultPeriod(k),t=todayKey();
  if(k==='night')return p===def?[(new Date().getHours()<12?'Last night':'Tonight'),fmtNight(p)]:['',fmtNight(p)];
  if(p===t)return['Today',fmtDay(p)];if(p===addDays(t,-1))return['Yesterday',fmtDay(p)];return['',fmtDay(p)];
}
function totals(k,p){
  const list=entries.filter(e=>e.kind===k&&e.period===p);
  const ml=list.reduce((s,e)=>s+(e.ml||0),0),urgs=list.filter(e=>e.urg).map(e=>e.urg);
  return{list,n:list.length,ml,avgU:urgs.length?urgs.reduce((a,b)=>a+b,0)/urgs.length:null,woke:list.filter(e=>e.woke==='Y').length};
}

    const noun=k==='intake'?'drink':k==='night'?'trip':'void';

    if(k==='night'&&t.woke)sub+=` · ${t.woke} woke me`;

    <div class="stepper"><button class="st-btn" data-act="step" data-d="-1" aria-label="Previous">${ico('left')}</button>
      <label class="st-label">${pre?`${esc(pre)}<small>${esc(main)}</small>`:esc(main)}<input type="date" class="st-pick" id="pick" value="${p}" max="${defaultPeriod(k)}"/></label>
      <button class="st-btn" data-act="step" data-d="1" ${isDef?'disabled':''} aria-label="Next">${ico('right')}</button></div>
    ${isDef?'':'<div style="text-align:center"><button class="today-pill" data-act="today">Back to '+(k==='night'?'tonight':'today')+'</button></div>'}
    <div class="hero-total"><span class="big">${big}</span><span class="hero-unit">${f.unit}</span></div>
    <div class="hero-sub">${esc(sub)}</div>`;

function entryRow(e){
  const other=e.unit==='ml'?fmtOz(e.ml)+' oz':fmtMl(e.ml)+' ml';
  const tags=[];
  if(e.kind==='intake'){const d=DRINKS.find(x=>x[0]===e.drink)||DRINKS[0];tags.push(`<span class="tag acc">${d[1]} ${esc(d[0])}</span>`);}
  if(e.kind==='night'&&e.woke==='Y')tags.push('<span class="tag acc">Woke me up</span>');
  if(e.kind==='night'&&e.woke==='N')tags.push('<span class="tag">Didn’t wake me</span>');
  (e.sym||[]).forEach(s=>{const l=SYMS.find(x=>x[0]===s);if(l)tags.push(`<span class="tag">${l[1]}</span>`);});
  const ub=e.urg?`<div><div class="ub" style="background:${UC[e.urg-1][0]};color:${UC[e.urg-1][1]}">${e.urg}</div><div class="ub-cap">urgency</div></div>`:'';
  return `<button class="entry" data-act="edit" data-k="${e.kind}" data-id="${e.id}">
    <div class="e-time">${fmt12(e.time)}</div>
    <div class="e-main"><div class="e-amt">${trimNum(e.amt)} ${e.unit}<small>${other}</small></div>
    ${tags.length?`<div class="tags">${tags.join('')}</div>`:''}${e.note?`<div class="e-note">${esc(e.note)}</div>`:''}</div>${ub}</button>`;
}
const trimNum=n=>String(Math.round(n*100)/100);
function renderList(k){
  const p=curPeriod(k),list=totals(k,p).list.slice();
  list.sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
  $(k+'-ltitle').textContent=k==='night'?'Night of '+fmtNight(p):fmtDay(p);
  $(k+'-lcount').textContent=list.length?list.length+(list.length===1?' entry':' entries'):'';
  $(k+'-list').innerHTML=list.length?list.map(entryRow).join(''):
    `<div class="empty"><span class="em">${k==='intake'?'💧':k==='night'?'🌙':'☀️'}</span>Nothing logged yet.<br>Entries you save will show up here — tap one to edit.</div>`;

function renderCutoff(){
  const p=curPeriod('intake'),c=cutoffs[p];
  $('cut-time').value=c||'';
  $('cut-save').textContent=c?'Update cut-off':'Set cut-off';

function needsBackup(){
  if(!entries.length)return null;
  const x=+localStorage.getItem(K_X)||0,now=Date.now(),D=86400000;
  if(!x){const first=Math.min(...entries.map(e=>e.ts||now));return now-first>=2*D?'You haven’t exported your data yet.':null;}
  const days=Math.floor((now-x)/D);
  return days>=3&&entries.some(e=>(e.ts||0)>x)?`Last export was ${days} days ago.`:null;
}
function renderBanner(){
  const m=(tab==='day'||tab==='night'||tab==='intake')?needsBackup():null;
  $('banner').innerHTML=m?`<div class="banner"><span>${m}</span><button data-act="export">Export now</button></div>`:'';

function renderNav(){

function render(){
  document.documentElement.dataset.tab=tab;
  const tc={day:'#ad430e',night:'#0a0f33',intake:'#09557f',stats:'#15503a',settings:'#15503a'}[tab];
  document.querySelector('meta[name=theme-color]').content=tc;

  if(t==='settings'&&tab!=='settings')prevTab=tab;

  hideTip();render();refreshTimes(false);window.scrollTo(0,0);

/* ═════════════ Stats ═════════════ */
function rangeBounds(){
  const end=todayKey();
  if(range>0)return{start:addDays(end,-(range-1)),end};
  const ps=entries.map(e=>e.period).concat(Object.keys(cutoffs));
  return{start:ps.length?ps.reduce((a,b)=>a<b?a:b):end,end};
}
function aggregate(){
  const {start,end}=rangeBounds(),cats=[];
  for(let d=start;d<=end;d=addDays(d,1))cats.push(d);
  const A={};cats.forEach(d=>A[d]={d,dayN:0,dayMl:0,nightN:0,nightMl:0,inMl:0,inN:0,woke:0,cut:cutoffs[d]||null,any:false});
  const voids=[],hourV=Array.from({length:24},()=>({d:0,n:0,us:0,un:0,inMl:0}));
  const sym={weak:0,dribble:0,incomplete:0,pain:0},drink={};let urgSum=0,urgN=0;
  entries.forEach(e=>{
    const a=A[e.period];if(!a)return;a.any=true;

    if(e.kind==='intake'){a.inMl+=e.ml||0;a.inN++;hourV[h].inMl+=e.ml||0;drink[e.drink||'Other']=(drink[e.drink||'Other']||0)+(e.ml||0);}

      if(e.urg){urgSum+=e.urg;urgN++;hourV[h].us+=e.urg;hourV[h].un++;}
      (e.sym||[]).forEach(s=>sym[s]++);
      const off=(pd(actDate(e))-pd(start))/86400000,mins=(+e.time.slice(0,2))*60+(+e.time.slice(3));
      voids.push({e,ml:e.ml,urg:e.urg,kind:e.kind,x:Math.round(off)+mins/1440});
    }

  const today=todayKey(),defN=defaultPeriod('night');
  const logged=cats.filter(d=>A[d].any),done=logged.filter(d=>d<today&&d<defN),basis=done.length?done:logged;
  const nights=logged.filter(d=>d<defN);
  const sum=(arr,f)=>arr.reduce((s,d)=>s+f(A[d]),0);
  const withMl=voids.filter(v=>v.ml>0);
  const outTot=sum(basis,a=>a.dayMl+a.nightMl),nightTot=sum(basis,a=>a.nightMl);
  const inDays=basis.filter(d=>A[d].inN>0);
  const cutVals=cats.filter(d=>A[d].cut&&d<=today).map(d=>{const[h,m]=A[d].cut.split(':').map(Number);return(h<4?h+24:h)*60+m;});
  const R={cats,A,voids,hourV,sym,drink,urgAvg:urgN?urgSum/urgN:null,nVoids:voids.length,logged,basis,nights,
    avgDayVoids:basis.length?sum(basis,a=>a.dayN)/basis.length:null,
    avgNight:nights.length?sum(nights,a=>a.nightN)/nights.length:null,
    avgVoid:withMl.length?withMl.reduce((s,v)=>s+v.ml,0)/withMl.length:null,
    maxVoid:withMl.length?withMl.reduce((a,b)=>b.ml>a.ml?b:a):null,
    avgOut:basis.length?outTot/basis.length:null,avgIn:inDays.length?sum(inDays,a=>a.inMl)/inDays.length:null,
    nightShare:outTot>0?nightTot/outTot:null,wokeNights:nights.filter(d=>A[d].woke>0).length,
    avgCut:cutVals.length?cutVals.reduce((a,b)=>a+b,0)/cutVals.length:null,nCut:cutVals.length,
    dayMlTot:sum(basis,a=>a.dayMl),nightMlTot:nightTot,defN};
  return R;
}
function fmtMinutes(m){m=Math.round(m)%1440;const h=Math.floor(m/60),mm=m%60;return fmt12(pad(h)+':'+pad(mm));}

function chartW(){return Math.max(260,Math.min(500,window.innerWidth)-32-36);}
function niceScale(maxV,int){
  if(!(maxV>0))maxV=int?4:1;

  step=(f<=1?1:f<=2?2:f<=5?5:10)*mag;if(int)step=Math.max(1,Math.ceil(step));
  const top=Math.ceil(maxV/step-1e-9)*step,ticks=[];for(let v=0;v<=top+1e-9;v+=step)ticks.push(Math.round(v*100)/100);
  return{top,ticks};
}

  const L=40,R=8,T=12,B=38,CW=chartW();

function frame(d,sc,xlabels,fmt){

    s+=`<line x1="${d.L}" x2="${d.W-d.R}" y1="${y}" y2="${y}" stroke="${t===0?CC.base:CC.grid}" stroke-width="1"/><text x="${d.L-7}" y="${y+3.5}" text-anchor="end" font-size="10" fill="${CC.mut}">${fmt?fmt(t):t.toLocaleString('en-US')}</text>`;});
  xlabels.forEach(l=>{s+=`<text x="${l.x}" y="${d.T+d.ph+15}" text-anchor="middle" font-size="10" fill="${CC.mut}">${l.t}</text>`;
    if(l.m)s+=`<text x="${l.x-6}" y="${d.T+d.ph+29}" text-anchor="start" font-size="10" font-weight="600" fill="${CC.ink2}">${l.m}</text>`;});

}
function catLabels(d,cats){

function barPath(x,yTop,w,yBot,r){
  const h=yBot-yTop;if(h<=0)return'';r=Math.min(r,h,w/2);
  return `M${x},${yBot}V${yTop+r}Q${x},${yTop} ${x+r},${yTop}H${x+w-r}Q${x+w},${yTop} ${x+w},${yTop+r}V${yBot}Z`;
}
function stackBars(x,w,d,sc,parts){ // parts: [[value,color]] bottom->top, 2px surface gap
  let s='',acc=0,y0=d.T+d.ph;

  parts.forEach((p,i)=>{

    const yb=y0-(acc/sc.top)*d.ph-(acc>0?2:0),yt=y0-((acc+p[0])/sc.top)*d.ph;
    const path=i===topI?barPath(x,yt,w,yb,4):`M${x},${yb}V${yt}H${x+w}V${yb}Z`;

}
function hitCol(id,i,x,d){return `<rect class="hit" data-c="${id}" data-i="${i}" x="${x}" y="${d.T}" width="${d.per}" height="${d.ph}"/>`;}
const legend=items=>`<div class="legend">${items.map(([c,l,t])=>`<span><i class="${t||''}" style="background:${c}"></i>${l}</span>`).join('')}</div>`;

function chartCutoff(R){

const hbars=(rows,color,fmt)=>{const mx=Math.max(...rows.map(r=>r.v),1);return rows.map(r=>`<div class="hbar"><span>${esc(r.l)}</span><div class="trk"><div class="fill" style="width:${(r.v/mx)*100}%;background:${color}"></div></div><span class="hv">${fmt(r)}</span></div>`).join('');};

function summaryText(R){
  const L=['Urologist Tracker — summary ('+fmtShort(R.cats[0])+' to '+fmtShort(R.cats[R.cats.length-1])+', '+R.logged.length+' logged days)'];
  const f=(l,v)=>{if(v!==null&&v!==undefined)L.push(l+': '+v);};
  f('Daytime voids per day',R.avgDayVoids!==null?R.avgDayVoids.toFixed(1):null);
  f('Night bathroom trips per night',R.avgNight!==null?R.avgNight.toFixed(1):null);
  f('Nights woken by the bathroom',R.nights.length?R.wokeNights+' of '+R.nights.length:null);
  f('Average voided volume',R.avgVoid!==null?fmtMl(R.avgVoid)+' ml ('+fmtOz(R.avgVoid)+' oz)':null);
  f('Largest single void',R.maxVoid?fmtMl(R.maxVoid.ml)+' ml ('+fmtOz(R.maxVoid.ml)+' oz)':null);
  f('Average urgency',R.urgAvg!==null?R.urgAvg.toFixed(1)+' / 10':null);

function renderStats(){

  ].join('');

    <div class="legend"><span><i style="background:${CC.day}"></i>Daytime ${dayP}% · ${fmtMl(R.dayMlTot)} ml</span><span><i style="background:${CC.night}"></i>Night ${nightP}% · ${fmtMl(R.nightMlTot)} ml</span></div>`;
  const symRows=SYMS.map(([k,l])=>({l,v:R.sym[k],p:R.nVoids?R.sym[k]/R.nVoids:0}));
  const drinkRows=DRINKS.map(([d,e])=>({l:e+' '+d,v:R.drink[d]||0})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  const rows=R.logged.slice().reverse().map(d=>{const a=R.A[d];return `<tr><td>${fmtShort(d)}</td><td>${a.dayN}</td><td>${a.nightN}</td><td>${fmtMl(a.dayMl+a.nightMl)}</td><td>${fmtMl(a.inMl)}</td><td>${a.cut?fmt12(a.cut).replace(' ',''):'–'}</td></tr>`;}).join('');
  const volume=chartVolume(R),urgency=chartUrgency(R);
  el.innerHTML=`
  <div class="card"><div class="card-head"><div class="card-title">Summary for your urologist</div><button class="link-btn" data-act="copysum" id="copysum">Copy</button></div>
    <div class="tiles">${tiles}</div><div class="note-s">Averages use completed days only (today is left out until it ends).</div></div>
  <div class="card"><div class="card-head"><div class="card-title">Intake vs. output</div></div>${chartIO(R)}
    <div class="chart-note">Output is daytime plus night voids for each day. Tap a day for exact amounts.</div></div>
  <div class="card"><div class="card-head"><div class="card-title">Bathroom trips per day</div></div>${chartVoids(R)}</div>
  <div class="card"><div class="card-head"><div class="card-title">Night share of output</div></div>${shareHTML}</div>
  <div class="card"><div class="card-head"><div class="card-title">Volume of each void</div></div>${volume||'<div class="empty" style="padding:10px 0">No amounts logged yet.</div>'}</div>
  <div class="card"><div class="card-head"><div class="card-title">Urgency over time</div></div>${urgency||'<div class="empty" style="padding:10px 0">No urgency ratings yet.</div>'}</div>
  <div class="card"><div class="card-head"><div class="card-title">When it happens</div></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Bathroom trips by hour of day</div>${chartHourVoids(R)}
    <div class="stat-sep"></div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">Liquid intake by hour of day (ml)</div>${chartHourIntake(R)}</div>
  <div class="card"><div class="card-head"><div class="card-title">Last drink vs. night trips</div></div>${chartCutoff(R)}</div>
  <div class="card"><div class="card-head"><div class="card-title">Symptoms</div></div>${R.nVoids?hbars(symRows,CC.slate,r=>r.v+' · '+Math.round(r.p*100)+'%'):'<div class="empty" style="padding:10px 0">No voids yet.</div>'}
    <div class="chart-note">Counts and share of all logged voids.</div></div>
  <div class="card"><div class="card-head"><div class="card-title">What you drank</div></div>${drinkRows.length?hbars(drinkRows,CC.intake,r=>fmtMl(r.v)+' ml'):'<div class="empty" style="padding:10px 0">No drinks logged yet.</div>'}</div>
  <div class="card"><div class="card-head"><div class="card-title">Day by day</div></div>
    <table class="tbl"><thead><tr><th>Date</th><th>Day</th><th>Night</th><th>Out ml</th><th>In ml</th><th>Last drink</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="chart-note">The numbers behind the charts. “Day” and “Night” are the counts of trips.</div></div>`;
  el.querySelectorAll('.chart-scroll[data-scroll="1"]').forEach(s=>{s.scrollLeft=s.scrollWidth;});
}

/* ── tooltips (tap or hover) ── */
function hideTip(){const t=$('tip');if(t)t.hidden=true;document.querySelectorAll('.hit.on').forEach(h=>h.classList.remove('on'));document.querySelectorAll('.hl').forEach(h=>h.setAttribute('display','none'));}
function showTipAt(cx,cy,data){
  const t=$('tip');t.innerHTML='';
  const tt=document.createElement('div');tt.className='tt';tt.textContent=data.t;t.appendChild(tt);
  data.rows.forEach(r=>{const row=document.createElement('div');row.className='tr';
    const k=document.createElement('span');k.className='tk';k.style.background=r.c;
    const v=document.createElement('span');v.className='tvv';v.textContent=r.v;
    const l=document.createElement('span');l.className='tl2';l.textContent=r.l;
    row.append(k,v,l);t.appendChild(row);});
  t.hidden=false;const w=t.offsetWidth,vw=window.innerWidth;
  t.style.left=Math.max(w/2+8,Math.min(vw-w/2-8,cx))+'px';t.style.top=Math.max(t.offsetHeight+8,cy-8)+'px';
}
function chartPointer(e){
  const hit=e.target.closest('.hit,.hitall');if(!hit){if(e.type==='click')hideTip();return;}
  const id=hit.dataset.c;
  if(hit.classList.contains('hit')){
    const data=TIPS[id]&&TIPS[id][+hit.dataset.i];if(!data)return;
    hideTip();hit.classList.add('on');const r=hit.getBoundingClientRect();showTipAt(r.left+r.width/2,r.top+10,data);
  }else{
    const svg=hit.ownerSVGElement,r=svg.getBoundingClientRect(),sx=svg.viewBox.baseVal.width/r.width;
    const x=(e.clientX-r.left)*sx,y=(e.clientY-r.top)*sx;let best=null,bd=1e9;
    (PTS[id]||[]).forEach(p=>{const dd=Math.hypot(p.x-x,p.y-y);if(dd<bd){bd=dd;best=p;}});
    if(!best||bd>30){hideTip();return;}
    hideTip();const hl=svg.querySelector('.hl');hl.setAttribute('cx',best.x);hl.setAttribute('cy',best.y);hl.removeAttribute('display');
    showTipAt(r.left+best.x/sx,r.top+best.y/sx-6,best.tip);
  }
}

/* ═════════════ Settings / export / import ═════════════ */
function renderSettings(){
  const x=+localStorage.getItem(K_X)||0,days=x?Math.floor((Date.now()-x)/86400000):null;
  const pct=!entries.length?0:!x?100:Math.min(days/7,1)*100,col=!x||days>=7?'#d03b3b':days>=4?'#e0a000':'#1f9e63';
  const lbl=!entries.length?'No entries yet':!x?'Never exported':(days===0?'Last export: today':days===1?'Last export: yesterday':`Last export: ${days} days ago`);
  $('view-settings').innerHTML=`
  <div class="card"><div class="card-head"><div class="card-title">Backup status</div></div>
    <div class="bar-meta"><span>${lbl}</span><span>${entries.length} entr${entries.length===1?'y':'ies'}</span></div>
    <div class="meter"><div style="width:${pct}%;background:${col}"></div></div></div>
  <div class="card"><div class="card-head"><div class="card-title">Export</div></div>
    <button class="btn-primary" data-act="export" style="display:flex;align-items:center;justify-content:center;gap:8px">${ico('up')}Export all data (CSV)</button>
    <div class="note-s">One CSV file with every day, night and intake group, plus totals and “no entries” rows for gaps. On iPhone it opens the share sheet — choose “Save to Files”, AirDrop or Mail. It opens in Excel, Numbers or Google Sheets.</div></div>
  <div class="card"><div class="card-head"><div class="card-title">Import</div></div>
    <button class="btn-ghost" data-act="importpick">${ico('down')}Import from CSV</button>
    <div class="note-s">Restores entries from a file exported by this app. Anything already on this phone is kept and duplicates are skipped.</div></div>
  <div class="card"><div class="card-head"><div class="card-title">About</div></div>
    <div class="note-s" style="margin-top:0">Everything is stored only on this phone — nothing is sent anywhere. Deleting the home-screen icon or clearing website data erases it, so export before your appointment and every few days.<br><br>Night entries logged before noon belong to the previous evening’s night. The unit (ml / oz) you used last is remembered for each tab.</div></div>
  <div class="card"><div class="card-head"><div class="card-title">Danger zone</div></div>
    <button class="btn-ghost danger" data-act="wipe">Delete all data on this phone</button></div>`;
}
const csvEsc=v=>{const s=String(v==null?'':v);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function catName(type,p){
  const a=pd(p);
  if(type==='night'){const b=pd(addDays(p,1));
    if(a.getMonth()===b.getMonth())return `Night - ${MON[a.getMonth()]} ${a.getDate()}-${b.getDate()}, ${b.getFullYear()}`;
    if(a.getFullYear()===b.getFullYear())return `Night - ${MON[a.getMonth()]} ${a.getDate()}-${MON[b.getMonth()]} ${b.getDate()}, ${b.getFullYear()}`;
    return `Night - ${MON[a.getMonth()]} ${a.getDate()}, ${a.getFullYear()}-${MON[b.getMonth()]} ${b.getDate()}, ${b.getFullYear()}`;}
  return `${type==='day'?'Day':'Liquid Intake'} - ${MON[a.getMonth()]} ${a.getDate()}, ${a.getFullYear()}`;
}
const CSV_HDR=['Category','Type','Period Date','Row','Date','Time','Amount (ml)','Amount (oz)','Entered Amount','Entered Unit','Urgency (1-10)','Woke Due To Bathroom','Weak Flow','Dribbling','Feeling Of Not Emptying','Pain Or Burning','Drink Type','Entries','Note'];
function buildCSV(){
  const rows=[CSV_HDR],ps=entries.map(e=>e.period).concat(Object.keys(cutoffs));
  if(!ps.length)return CSV_HDR.map(csvEsc).join(',');
  const minD=ps.reduce((a,b)=>a<b?a:b),maxD=ps.reduce((a,b)=>a>b?a:b),TN={day:'Day',night:'Night',intake:'Intake'};
  for(let d=minD;d<=maxD;d=addDays(d,1)){
    ['day','night','intake'].forEach(k=>{
      const list=entries.filter(e=>e.kind===k&&e.period===d).sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
      const cut=k==='intake'?cutoffs[d]:null,cat=catName(k,d);
      if(!list.length&&!cut){if(d>=defaultPeriod(k))return;rows.push([cat,TN[k],d,'No entries','','','','','','','','','','','','','',0,'Nothing logged']);return;}
      list.forEach(e=>rows.push([cat,TN[k],d,'Entry',actDate(e),fmt12(e.time),Math.round(e.ml*10)/10,r1(e.ml/MLOZ),e.amt,e.unit,e.urg||'',e.kind==='night'?(e.woke==='Y'?'Yes':e.woke==='N'?'No':''):'',
        ...['weak','dribble','incomplete','pain'].map(s=>(e.sym||[]).includes(s)?'Yes':''),e.drink||'','',e.note||'']));
      if(cut)rows.push([cat,TN[k],d,'Cut-off',d,fmt12(cut),'','','','','','','','','','','','','Last drink of the evening']);
      if(list.length){
        const ml=list.reduce((s,e)=>s+(e.ml||0),0),us=list.filter(e=>e.urg).map(e=>e.urg);
        rows.push([cat,TN[k],d,'Summary','','',Math.round(ml*10)/10,r1(ml/MLOZ),'','',us.length?r1(us.reduce((a,b)=>a+b,0)/us.length):'',k==='night'?list.filter(e=>e.woke==='Y').length:'',
          ...['weak','dribble','incomplete','pain'].map(s=>k==='intake'?'':list.filter(e=>(e.sym||[]).includes(s)).length),'',list.length,k==='intake'?'Total intake':'Total voided (avg urgency shown)']);
      }
    });
  }
  return rows.map(r=>r.map(csvEsc).join(',')).join('\r\n');
}
async function doExport(){
  if(!entries.length&&!Object.keys(cutoffs).length){alert('Nothing to export yet.');return;}
  const name=`urologist-tracker_${todayKey()}.csv`,file=new File(['﻿'+buildCSV()],name,{type:'text/csv'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Urologist Tracker export'});markExported();return;}
  }catch(err){if(err&&err.name==='AbortError')return;}
  const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);markExported();
}
function markExported(){try{localStorage.setItem(K_X,String(Date.now()));}catch(e){}render();}
function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=c;}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>x!==''));
}
function parseTime(s){const m=String(s||'').trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);if(!m)return null;let h=+m[1];const mi=+m[2];if(m[3]){const pm=m[3].toUpperCase()==='PM';if(pm&&h!==12)h+=12;if(!pm&&h===12)h=0;}if(h>23||mi>59)return null;return pad(h)+':'+pad(mi);}
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2){alert('That file looks empty.');return;}
  const H=rows[0].map(s=>s.trim()),ix=n=>H.indexOf(n);
  if(ix('Type')<0||ix('Row')<0||ix('Period Date')<0){alert('This doesn’t look like a file exported from Urologist Tracker.');return;}
  const key=e=>[e.kind,e.period,e.time,e.amt,e.unit,e.urg||'',e.drink||''].join('|'),have=new Set(entries.map(key));
  let added=0,skipped=0,cuts=0;
  rows.slice(1).forEach(r=>{
    const g=n=>(r[ix(n)]||'').trim(),row=g('Row'),type=g('Type').toLowerCase(),period=g('Period Date');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(period)||!['day','night','intake'].includes(type))return;
    if(row==='Cut-off'){const t=parseTime(g('Time'));if(t&&!cutoffs[period]){cutoffs[period]=t;cuts++;}return;}
    if(row!=='Entry')return;
    const time=parseTime(g('Time'));let amt=parseFloat(g('Entered Amount')),unit=g('Entered Unit').toLowerCase();
    if(!(amt>0)||!['ml','oz'].includes(unit)){amt=parseFloat(g('Amount (ml)'));unit='ml';}
    if(!time||!(amt>0)){skipped++;return;}
    const e={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind:type,period,time,amt,unit,ml:Math.round(toMl(amt,unit)*10)/10,note:g('Note'),ts:Date.now()};
    if(type==='intake')e.drink=g('Drink Type')||'Other';
    else{e.urg=parseInt(g('Urgency (1-10)'))||null;e.sym=[['weak','Weak Flow'],['dribble','Dribbling'],['incomplete','Feeling Of Not Emptying'],['pain','Pain Or Burning']].filter(([k,c])=>/^y/i.test(g(c))).map(x=>x[0]);}
    if(type==='night'){const w=g('Woke Due To Bathroom');e.woke=/^y/i.test(w)?'Y':/^n/i.test(w)?'N':'';}
    if(have.has(key(e))){skipped++;return;}
    have.add(key(e));entries.push(e);added++;
  });
  persist();render();
  alert(`Imported ${added} entr${added===1?'y':'ies'}${cuts?` and ${cuts} cut-off${cuts===1?'':'s'}`:''}${skipped?` (${skipped} skipped as duplicates or unreadable)`:''}.`);
}

/* ═════════════ Events ═════════════ */
const ACT={
  tab:t=>setTab(t.dataset.tab),
  back:()=>setTab(prevTab||'day'),
  step:t=>{const k=tab,def=defaultPeriod(k),p=addDays(curPeriod(k),+t.dataset.d);if(p>def)return;sel[k]=p===def?null:p;render();},
  today:()=>{sel[tab]=null;render();},
  range:t=>{range=+t.dataset.v;render();},
  unit:t=>{const k=t.dataset.k,f=F[k],u=t.dataset.u;if(f.unit===u)return;const inp=$(k+'-amt'),v=parseFloat(inp.value.replace(',','.'));
    if(v>0){const ml=toMl(v,f.unit);inp.value=u==='oz'?String(r1(ml/MLOZ)):String(Math.round(ml));}
    f.unit=u;syncForm(k);renderHero();},
  preset:t=>{const k=t.dataset.k;$(k+'-amt').value=t.dataset.v;convHint(k);},
  urg:t=>{const f=F[t.dataset.k],n=+t.dataset.n;f.urg=f.urg===n?null:n;syncForm(t.dataset.k);},
  sym:t=>{const f=F[t.dataset.k],s=t.dataset.s;f.sym.has(s)?f.sym.delete(s):f.sym.add(s);syncForm(t.dataset.k);},
  woke:t=>{const f=F[t.dataset.k],v=t.dataset.v;f.woke=f.woke===v?'':v;syncForm(t.dataset.k);},
  drink:t=>{F[t.dataset.k].drink=t.dataset.v;syncForm(t.dataset.k);},
  note:t=>{const f=F[t.dataset.k];f.noteOpen=!f.noteOpen;syncForm(t.dataset.k);if(f.noteOpen)$(t.dataset.k+'-note').focus();},
  now:t=>{const k=t.dataset.k;$(k+'-time').value=nowHHMM();F[k].timeDirty=false;},
  save:t=>saveEntry(t.dataset.k),
  cancel:t=>{resetForm(t.dataset.k);},
  del:t=>delEntry(t.dataset.k),
  edit:t=>editEntry(t.dataset.k,t.dataset.id),
  cutnow:()=>{$('cut-time').value=nowHHMM();},
  cutsave:()=>{const v=$('cut-time').value;if(!v){const b=$('cut-save');b.textContent='Pick a time first';b.classList.add('err');setTimeout(()=>{b.classList.remove('err');renderCutoff();},1400);return;}
    cutoffs[curPeriod('intake')]=v;persist();render();},
  cutclear:()=>{delete cutoffs[curPeriod('intake')];persist();render();},
  export:()=>doExport(),
  importpick:()=>$('csv-in').click(),
  copysum:async t=>{const txt=summaryText(window.__R);try{await navigator.clipboard.writeText(txt);t.textContent='Copied ✓';}catch(e){prompt('Copy this summary:',txt);}setTimeout(()=>{t.textContent='Copy';},1600);},
  wipe:()=>{if(!confirm('Delete ALL entries and cut-offs on this phone? This cannot be undone.'))return;if(!confirm('Really delete everything? Export first if you want a copy.'))return;
    entries=[];cutoffs={};persist();try{localStorage.removeItem(K_X);}catch(e){}KINDS.forEach(resetForm);render();}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t&&ACT[t.dataset.act]){ACT[t.dataset.act](t,e);return;}
  chartPointer(e);
});
document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&e.target.closest&&e.target.closest('.hit,.hitall'))chartPointer(e);});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;
  if(t.dataset.in==='time')F[k].timeDirty=true;
  if(t.dataset.in==='amt')convHint(k);
});
document.addEventListener('change',e=>{
  if(e.target.id==='pick'){const k=tab,v=e.target.value,def=defaultPeriod(k);if(!v)return;const p=v>def?def:v;sel[k]=p===def?null:p;render();}
  if(e.target.id==='csv-in'){const f=e.target.files[0];if(!f)return;f.text().then(importCSV).catch(()=>alert('Could not read that file.'));e.target.value='';}
});
window.addEventListener('scroll',hideTip,{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshTimes(false);render();}});
setInterval(()=>{if(!document.hidden)refreshTimes(false);},30000);

/* ═════════════ Boot ═════════════ */
function init(){
  load();
  KINDS.forEach(k=>{F[k]=newForm(k);$('view-'+k).innerHTML=formHTML(k);});
  KINDS.forEach(k=>{syncForm(k);$(k+'-time').value=nowHHMM();});
  let t='day';try{const s=localStorage.getItem(K_T);if(KINDS.includes(s))t=s;}catch(e){}
  tab=t;render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
</script>
